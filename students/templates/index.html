<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Student Management System</a>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="text-center text-primary">Student Management System</h1>

    <div class="text-end mb-3">
        <a href="/admin/" class="btn btn-success">Add Student</a>
    </div>
    <table class="table table-bordered table-striped mt-4">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
            <td>
                <a href="{% url 'edit' s.id %}">
                    {{s.name}}
                </a>
            </td>
                <td>{{ s.email }}</td>
                <td>{{ s.course }}</td>
                <td>{{ s.age }}</td>
                <td>
                    <a href="{% url 'edit' s.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'delete' s.id %}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
